services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: movie
      POSTGRES_PASSWORD: movie
      POSTGRES_DB: movie_memory
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie -d movie_memory"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - movie_data:/var/lib/postgresql/data
volumes:
  movie_data:
