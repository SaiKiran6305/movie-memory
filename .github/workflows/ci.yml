name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movie
          POSTGRES_PASSWORD: movie
          POSTGRES_DB: movie_memory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U movie -d movie_memory_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://movie:movie@localhost:5432/movie_memory_test?connection_limit=15
      DIRECT_URL: postgresql://movie:movie@localhost:5432/movie_memory_test
      TEST_DATABASE_URL: postgresql://movie:movie@localhost:5432/movie_memory_test?connection_limit=15
      AUTH_SECRET: local-test-secret-not-for-production-000000000000
      AUTH_URL: http://localhost:3000
      AUTH_GOOGLE_ID: test
      AUTH_GOOGLE_SECRET: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
